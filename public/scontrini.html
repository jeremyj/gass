<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Scontrini</title>
    <link rel="stylesheet" href="style.css?v=91">
</head>
<body>
    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div class="stag-top">
            <span id="header-when" class="stag-when" data-label="Scontrini della consegna di" data-today="Scontrini della consegna di oggi">Scontrini della consegna</span>
            <div class="header-actions">
                <span id="user-display" class="user-name"></span>
                <button type="button" onclick="handleLogout()" class="icon-btn" title="Esci" aria-label="Esci"><svg aria-hidden="true"><use href="#i-esci"/></svg></button>
            </div>
        </div>
        <h1 id="header-date-display"></h1>
    </header>

    <main class="container">
        <div id="status" class="status" role="status"></div>
        <p id="galleria-meta" class="hint hint-top"></p>
        <div id="galleria"></div>
    </main>

    <nav class="bottom-nav">
        <a href="/consegna" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-consegna"/></svg>Consegna</a>
        <a href="/debiti" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-saldi"/></svg>Saldi</a>
        <a href="/storico" class="bottom-nav-item active"><svg aria-hidden="true"><use href="#i-storico"/></svg>Storico</a>
        <a href="/turni" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-turni"/></svg>Turni</a>
    </nav>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=44"></script>
    <script src="js/shared/season.js?v=34"></script>
    <script src="js/shared/calendar.js?v=37"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/auth.js?v=34"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/shared/scontrini.js?v=3"></script>
    <script src="js/galleria-scontrini.js?v=2"></script>
</body>
</html>
