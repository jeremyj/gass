<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Storico</title>
    <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
    <header class="stag">
        <svg class="stag-ill" aria-hidden="true"><use href="#ill-zucca"/></svg>
        <div class="stag-top">
            <span class="stag-when">Tutte le consegne</span>
            <div class="header-actions">
                <span id="user-display" class="user-name"></span>
                <button type="button" onclick="handleLogout()" class="icon-btn" title="Esci" aria-label="Esci"><svg aria-hidden="true"><use href="#i-esci"/></svg></button>
            </div>
        </div>
        <h1>Storico</h1>
        <p id="season-produce" class="stag-prod"></p>
    </header>

    <main class="container">
        <div id="status" class="status" role="status"></div>
        <ul id="storico-list" class="storico-list"></ul>
    </main>

    <nav class="bottom-nav">
        <a href="/consegna" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-consegna"/></svg>Consegna</a>
        <a href="/debiti" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-saldi"/></svg>Saldi</a>
        <a href="/storico" class="bottom-nav-item active"><svg aria-hidden="true"><use href="#i-storico"/></svg>Storico</a>
    </nav>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=30"></script>
    <script src="js/shared/season.js?v=30"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/auth.js?v=30"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/storico.js?v=30"></script>
</body>
</html>
