<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Saldi</title>
    <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div class="stag-top">
            <span id="header-when" class="stag-when" data-label="Saldi al" data-today="Saldi di oggi">Saldi di oggi</span>
            <div class="header-actions">
                <span id="user-display" class="user-name"></span>
                <button type="button" onclick="handleLogout()" class="icon-btn" title="Esci" aria-label="Esci"><svg aria-hidden="true"><use href="#i-esci"/></svg></button>
            </div>
        </div>
        <h1 id="header-date-display"></h1>
        <div class="header-date-section">
            <button type="button" class="change-date-btn ghost" onclick="toggleDatePicker()">Cambia data</button>
            <div id="date-picker-container" class="date-picker-popup initially-hidden"></div>
        </div>
    </header>

    <div id="saldi-totals" class="tot2"></div>

    <main class="container">
        <input type="hidden" id="data" required>
        <input type="hidden" id="data-display">

        <div id="status" class="status" role="status"></div>

        <div class="sect">
            <h2>Partecipanti</h2>
            <span class="sect-meta">Tocca un nome per i dettagli</span>
        </div>
        <ul id="saldi-list" class="mov-list"></ul>
    </main>

    <nav class="bottom-nav">
        <a href="/consegna" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-consegna"/></svg>Consegna</a>
        <a href="/debiti" class="bottom-nav-item active"><svg aria-hidden="true"><use href="#i-saldi"/></svg>Saldi</a>
        <a href="/storico" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-storico"/></svg>Storico</a>
    </nav>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=34"></script>
    <script src="js/shared/season.js?v=32"></script>
    <script src="js/shared/calendar.js?v=31"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/debiti-common.js?v=30"></script>
    <script src="js/shared/auth.js?v=32"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/debiti.js?v=32"></script>
</body>
</html>
