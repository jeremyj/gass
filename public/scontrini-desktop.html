<!DOCTYPE html>
<html lang="it">
<head>

    <title>GASS Torpignattara - Scontrini</title>
    <link rel="stylesheet" href="style.css?v=91">
</head>
<body>
    <nav class="nav-menu">
        <span class="brand">GASS Torpignattara</span>
        <ul>
            <li><a href="/consegna">Consegna</a></li>
            <li><a href="/debiti">Saldi</a></li>

    <script src="js/shared/utils.js?v=44"></script>
