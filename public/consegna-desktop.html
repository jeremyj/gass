<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Consegna</title>
    <link rel="stylesheet" href="style.css?v=101">
</head>
<body>
    <nav class="nav-menu">
        <span class="brand">GASS Torpignattara</span>
        <ul>
            <li><a href="/consegna" class="active">Consegna</a></li>
            <li><a href="/debiti">Saldi</a></li>
            <li><a href="/storico">Storico</a></li>
            <li><a href="/turni">Turni</a></li>
            <li id="nav-teatro" class="initially-hidden"><a href="/teatro">Teatro</a></li>
            <li id="nav-logs" class="initially-hidden"><a href="/logs">Attività</a></li>
            <li id="nav-altobelli" class="initially-hidden"><a href="/altobelli">Altobelli</a></li>
        </ul>
        <div class="nav-user">
            <span id="user-display"></span>
            <button type="button" class="link-btn" onclick="handleLogout()">Esci</button>
        </div>
    </nav>

    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div id="header-when" class="stag-when" data-label="Consegna di" data-today="Consegna di oggi">Consegna di oggi</div>
        <h1 id="header-date-display"></h1>
        <div class="stag-acts">
            <div id="consegna-status-section" class="stato initially-hidden">
                <span id="closed-badge" class="stato-label chiusa initially-hidden">Consegna chiusa</span>
                <span id="open-badge" class="stato-label aperta">Consegna aperta</span>
                <button type="button" id="close-consegna-btn" class="link-btn" onclick="toggleConsegnaStatus()">Chiudi consegna</button>
                <button type="button" id="btn-annulla-consegna" class="link-btn initially-hidden" onclick="annullaConsegna()">Elimina consegna</button>
            </div>
        </div>
    </header>

    <main class="container">
        <input type="hidden" id="data" required>

        <div id="status" class="status" role="status"></div>
        <div id="avviso-aperte" class="avviso initially-hidden" role="status"></div>

        <form id="consegna-form" class="d-grid" onsubmit="event.preventDefault(); saveData();">
            <aside class="cassa-v" aria-label="Cassa">
                <p>
                    <label for="trovatoInCassa">Trovato</label>
                    <span><output id="trovatoInCassa">–</output> €</span>
                </p>
                <p>
                    <label for="incassatoCassa">+ Incassato</label>
                    <span><output id="incassatoCassa">–</output> €</span>
                </p>
                <p>
                    <label for="pagatoProduttore">− Pagato al produttore</label>
                    <span><output id="pagatoProduttore">–</output> €</span>
                </p>
                <div id="uscite-view" class="uscite-cell initially-hidden"></div>
                <p class="tot">
                    <label for="lasciatoInCassa">= In cassa</label>
                    <span><output id="lasciatoInCassa">–</output> €</span>
                </p>
                <div id="cassa-warning" class="cassa-warning initially-hidden" role="alert"></div>
                <p id="quote-teatro-oggi" class="teatro-oggi initially-hidden" data-tip="teatro_oggi">Quote teatro raccolte: <output>0</output></p>
                <div id="quaderno-box" class="scontrini-box quaderno-box initially-hidden"></div>
                <div id="note-giornata-group" class="form-group note-giornata initially-hidden">
                    <label for="noteGiornata">Note della giornata</label>
                    <input type="text" id="noteGiornata" placeholder="Aggiungi una nota" oninput="onNoteGiornataChange()">
                    <div class="uscite-blocco">
                        <label data-tip="uscite">Entrate/uscite di cassa</label>
                        <div id="uscite-edit" class="uscite-edit"></div>
                        <div id="uscite-errore" class="cassa-warning initially-hidden" role="alert"></div>
                    </div>
                    <button type="submit" class="btn btn-go initially-hidden" id="save-btn-cassa">Salva</button>
                </div>
            </aside>

            <section>
                <button type="button" id="btn-nuova-consegna" class="btn btn-go initially-hidden" onclick="startNuovaConsegna()">Nuova consegna</button>

                <div id="section-partecipanti" class="initially-hidden">
                    <div class="d-bar">
                        <h2>Chi ha ritirato</h2>
                        <select id="participant-select" class="add-select" onchange="showParticipantForm()" aria-label="Aggiungi gassista">
                            <option value="">+ Aggiungi gassista</option>
                        </select>
                    </div>
                    <div id="movimenti-giorno"></div>
                    <p id="scontrini-link" class="scontrini-link"></p>
                    <div id="selected-participants"></div>
                </div>
            </section>
        </form>
    </main>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=45"></script>
    <script src="js/shared/bozze.js?v=1"></script>
    <script src="js/shared/tips.js?v=9"></script>
    <script src="js/shared/season.js?v=34"></script>
    <script src="js/shared/calendar.js?v=37"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/consegna-common.js?v=59"></script>
    <script src="js/shared/auth.js?v=35"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/shared/scontrini.js?v=6"></script>
    <script src="js/consegna-desktop.js?v=41"></script>
</body>
</html>
