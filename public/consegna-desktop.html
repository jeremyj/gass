<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Consegna</title>
    <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
    <nav class="nav-menu">
        <span class="brand">GASS Torpignattara</span>
        <ul>
            <li><a href="/consegna" class="active">Consegna</a></li>
            <li><a href="/debiti">Saldi</a></li>
            <li><a href="/storico">Storico</a></li>
            <li id="nav-logs" class="initially-hidden"><a href="/logs">Attività</a></li>
        </ul>
        <div class="nav-user">
            <span id="user-display"></span>
            <button type="button" class="link-btn" onclick="handleLogout()">Esci</button>
        </div>
    </nav>

    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div id="header-when" class="stag-when" data-label="Consegna di" data-today="Consegna di oggi">Consegna di oggi</div>
        <h1 id="header-date-display"></h1>
        <div class="stag-acts">
            <div class="header-date-section">
                <button type="button" class="change-date-btn ghost" onclick="toggleDatePicker()">Cambia data</button>
                <div id="date-picker-container" class="date-picker-popup initially-hidden"></div>
            </div>
            <div id="consegna-status-section" class="stato initially-hidden">
                <span id="closed-badge" class="stato-label chiusa initially-hidden">Consegna chiusa</span>
                <span id="open-badge" class="stato-label aperta">Consegna aperta</span>
                <button type="button" id="close-consegna-btn" class="link-btn" onclick="toggleConsegnaStatus()">Chiudi consegna</button>
                <button type="button" id="btn-annulla-consegna" class="link-btn initially-hidden" onclick="annullaConsegna()">Annulla consegna</button>
            </div>
        </div>
    </header>

    <main class="container">
        <input type="hidden" id="data" required>
        <input type="hidden" id="data-display">

        <div id="status" class="status" role="status"></div>

        <form id="consegna-form" class="d-grid" onsubmit="event.preventDefault(); saveData();">
            <aside class="cassa-v" aria-label="Cassa">
                <p>
                    <label for="trovatoInCassa">Trovato in cassa</label>
                    <output id="trovatoInCassa">0</output>
                </p>
                <p>
                    <label for="incassatoCassa">+ Incassato</label>
                    <output id="incassatoCassa">0</output>
                </p>
                <p>
                    <label for="pagatoProduttore">− Pagato al produttore</label>
                    <output id="pagatoProduttore">0</output>
                </p>
                <p class="tot">
                    <label for="lasciatoInCassa">= Lasciato in cassa</label>
                    <output id="lasciatoInCassa">0</output>
                </p>
                <div id="cassa-warning" class="cassa-warning initially-hidden" role="alert"></div>
                <div id="note-giornata-group" class="form-group note-giornata initially-hidden">
                    <label for="noteGiornata">Note della giornata</label>
                    <input type="text" id="noteGiornata" placeholder="Aggiungi una nota" oninput="onNoteGiornataChange()">
                    <button type="submit" class="btn btn-go initially-hidden" id="save-btn-cassa">Salva note</button>
                </div>
            </aside>

            <section>
                <button type="button" id="btn-nuova-consegna" class="btn btn-go initially-hidden" onclick="startNuovaConsegna()">Nuova consegna</button>

                <div id="section-partecipanti" class="initially-hidden">
                    <div class="d-bar">
                        <h2>Movimenti</h2>
                        <select id="participant-select" class="add-select" onchange="showParticipantForm()" aria-label="Aggiungi partecipante">
                            <option value="">+ Aggiungi partecipante</option>
                        </select>
                    </div>
                    <div id="movimenti-giorno"></div>
                    <div id="selected-participants"></div>
                </div>
            </section>
        </form>
    </main>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=34"></script>
    <script src="js/shared/season.js?v=32"></script>
    <script src="js/shared/calendar.js?v=31"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/consegna-common.js?v=31"></script>
    <script src="js/shared/auth.js?v=32"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/consegna-desktop.js?v=32"></script>
</body>
</html>
