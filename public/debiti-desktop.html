<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Saldi</title>
    <link rel="stylesheet" href="style.css?v=83">
</head>
<body>
    <nav class="nav-menu">
        <span class="brand">GASS Torpignattara</span>
        <ul>
            <li><a href="/consegna">Consegna</a></li>
            <li><a href="/debiti" class="active">Saldi</a></li>
            <li><a href="/storico">Storico</a></li>
            <li><a href="/turni">Turni</a></li>
            <li id="nav-teatro" class="initially-hidden"><a href="/teatro">Teatro</a></li>
            <li id="nav-logs" class="initially-hidden"><a href="/logs">Attività</a></li>
        </ul>
        <div class="nav-user">
            <span id="user-display"></span>
            <button type="button" class="link-btn" onclick="handleLogout()">Esci</button>
        </div>
    </nav>

    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div id="header-when" class="stag-when" data-label="Saldi al" data-today="Saldi di oggi">Saldi di oggi</div>
        <h1 id="header-date-display"></h1>
        <div class="stag-acts">
            <button id="btn-add-participant" type="button" class="ghost" onclick="showAddForm()">+ Aggiungi partecipante</button>
        </div>
    </header>

    <main class="container">

        <div id="status" class="status" role="status"></div>

        <div id="add-form" class="panel initially-hidden">
            <h2>Nuovo partecipante</h2>
            <form onsubmit="event.preventDefault(); addParticipant();">
                <div class="form-row">
                    <div class="form-group">
                        <label for="new-name">Nome completo</label>
                        <input type="text" id="new-name" placeholder="Nome e cognome" required>
                    </div>
                    <div class="form-group">
                        <label for="new-username">Username</label>
                        <input type="text" id="new-username" placeholder="username" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Password</label>
                        <input type="password" id="new-password" placeholder="almeno 8 caratteri" required minlength="8">
                    </div>
                </div>
                <div class="entry-actions">
                    <button type="button" class="btn btn-line" onclick="hideAddForm()">Annulla</button>
                    <button type="submit" class="btn btn-go">Aggiungi partecipante</button>
                </div>
            </form>
        </div>


        <div class="d-head2">
            <h2>Partecipanti</h2>
            <label id="show-inactive-wrap" class="show-inactive initially-hidden"><input type="checkbox" id="show-inactive" onchange="renderParticipants()"> Mostra disattivati</label>
            <div id="saldi-totals" class="tots"></div>
        </div>

        <table id="participants-table" class="t">
            <thead>
                <tr>
                    <th>Partecipante</th>
                    <th id="th-username" class="left">Username</th>
                    <th>Saldo</th>
                    <th>Quota teatro</th>
                    <th>Ultimo movimento</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="participants-body">
            </tbody>
        </table>
    </main>

    <!-- Edit User Modal (Admin only) -->
    <div id="edit-user-modal" class="modal initially-hidden">
        <div class="modal-content">
            <h3>Modifica utente</h3>
            <form onsubmit="event.preventDefault(); submitEditUser();">
                <div class="form-group">
                    <label>Username</label>
                    <span id="edit-user-username" class="static-value"></span>
                    <small class="hint">non si può modificare</small>
                </div>
                <div class="form-group">
                    <label for="edit-user-displayname">Nome completo</label>
                    <input type="text" id="edit-user-displayname" required>
                </div>
                <div class="form-group">
                    <label for="edit-user-password">Nuova password</label>
                    <input type="password" id="edit-user-password" placeholder="Lascia vuoto per non modificare" minlength="8">
                </div>
                <div class="form-group">
                    <label data-tip="stato">Stato</label>
                    <div class="stato-opts">
                        <label class="stato-opt"><input type="radio" name="edit-user-stato" value="attivo"><span><b>Attivo</b><small>Accede, ordina, fa i turni</small></span></label>
                        <label class="stato-opt"><input type="radio" name="edit-user-stato" value="sospeso"><span><b>No turni</b><small>Partecipa al GASS ma non fa i turni</small></span></label>
                        <label class="stato-opt"><input type="radio" name="edit-user-stato" value="disattivato"><span><b>Disattivato</b><small>Ha lasciato il GASS: non accede e non compare negli elenchi</small></span></label>
                    </div>
                </div>
                <div id="edit-user-error" class="error-message initially-hidden"></div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-danger push-left" onclick="deleteUserFromModal()">Elimina utente</button>
                    <button type="button" class="btn btn-line" onclick="closeEditUserModal()">Annulla</button>
                    <button type="submit" class="btn btn-go">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=42"></script>
    <script src="js/shared/tips.js?v=1"></script>
    <script src="js/shared/season.js?v=33"></script>
    <script src="js/shared/calendar.js?v=36"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/debiti-common.js?v=41"></script>
    <script src="js/shared/auth.js?v=33"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/debiti-desktop.js?v=46"></script>
</body>
</html>
