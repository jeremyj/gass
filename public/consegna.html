<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Consegna</title>
    <link rel="stylesheet" href="style.css?v=80">
</head>
<body>
    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div class="stag-top">
            <span id="header-when" class="stag-when" data-label="Consegna di" data-today="Consegna di oggi">Consegna di oggi</span>
            <div class="header-actions">
                <span id="user-display" class="user-name"></span>
                <button type="button" onclick="handleLogout()" class="icon-btn" title="Esci" aria-label="Esci"><svg aria-hidden="true"><use href="#i-esci"/></svg></button>
            </div>
        </div>
        <h1 id="header-date-display"></h1>
    </header>

    <main class="container">
        <input type="hidden" id="data" required>

        <div id="status" class="status" role="status"></div>
        <div id="avviso-aperte" class="avviso initially-hidden" role="status"></div>

        <section class="conto" aria-label="Cassa">
            <div>
                <label for="trovatoInCassa">Trovato</label>
                <output id="trovatoInCassa">–</output>
            </div>
            <div>
                <label for="incassatoCassa">Incassato</label>
                <span class="conto-val"><i>+</i><output id="incassatoCassa">–</output></span>
            </div>
            <div>
                <label for="pagatoProduttore">Pagato</label>
                <span class="conto-val"><i>−</i><output id="pagatoProduttore">–</output></span>
            </div>
            <div class="tot">
                <label for="lasciatoInCassa">In cassa</label>
                <span class="conto-val"><i>=</i><output id="lasciatoInCassa">–</output></span>
            </div>
            <div id="uscite-view" class="uscite-cell initially-hidden">
                <label>Uscite di cassa, già tolte: <span class="uscite-motivo"></span></label>
                <span class="conto-val"><i>−</i><output>0</output></span>
            </div>
            <div id="quote-teatro-oggi" class="teatro-cell initially-hidden">
                <label>Quote teatro di questa consegna, a parte dalla cassa</label>
                <output>0</output>
            </div>
        </section>
        <div id="cassa-warning" class="cassa-warning initially-hidden" role="alert"></div>

        <div id="consegna-status-section" class="stato initially-hidden">
            <span id="closed-badge" class="stato-label chiusa initially-hidden">Consegna chiusa</span>
            <span id="open-badge" class="stato-label aperta">Consegna aperta</span>
            <button type="button" id="close-consegna-btn" class="link-btn" onclick="toggleConsegnaStatus()">Chiudi consegna</button>
            <button type="button" id="btn-annulla-consegna" class="link-btn danger initially-hidden" onclick="annullaConsegna()">Annulla consegna</button>
        </div>

        <div id="note-giornata-group" class="form-group note-giornata initially-hidden">
            <label for="noteGiornata">Note della giornata</label>
            <input type="text" id="noteGiornata" class="input-field" placeholder="Aggiungi una nota" oninput="onNoteGiornataChange()">
            <label for="usciteCassa">Uscite di cassa</label>
            <div class="uscite-edit">
                <input type="text" inputmode="decimal" id="usciteCassa" class="input-field" placeholder="0" oninput="normalizeInputField(this); onNoteGiornataChange()">
                <input type="text" id="usciteMotivo" class="input-field" placeholder="Motivo, es. quote al teatro" aria-label="Motivo delle uscite" oninput="onNoteGiornataChange()">
            </div>
            <button id="save-note-btn" class="btn btn-go initially-hidden" onclick="saveNoteOnly()">Salva</button>
        </div>

        <button id="btn-nuova-consegna" class="btn btn-go btn-block initially-hidden" onclick="startNuovaConsegna()">Nuova consegna</button>

        <section id="section-movimenti" class="movimenti initially-hidden">
            <select id="participant-select" class="add-select" onchange="showParticipantForm()" aria-label="Aggiungi partecipante">
                <option value="">+ Aggiungi partecipante</option>
            </select>
            <div id="selected-participants"></div>
            <div class="sect">
                <h2>Chi ha ritirato</h2>
                <span id="movimenti-count" class="sect-meta"></span>
            </div>
            <ul id="movimenti-giorno" class="mov-list"></ul>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="/consegna" class="bottom-nav-item active"><svg aria-hidden="true"><use href="#i-consegna"/></svg>Consegna</a>
        <a href="/debiti" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-saldi"/></svg>Saldi</a>
        <a href="/storico" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-storico"/></svg>Storico</a>
        <a href="/turni" class="bottom-nav-item"><svg aria-hidden="true"><use href="#i-turni"/></svg>Turni</a>
    </nav>

    <footer class="app-footer">
        <span id="app-version"></span>
    </footer>

    <script src="js/shared/utils.js?v=41"></script>
    <script src="js/shared/season.js?v=33"></script>
    <script src="js/shared/calendar.js?v=36"></script>
    <script src="js/shared/api-client.js"></script>
    <script src="js/shared/consegna-common.js?v=43"></script>
    <script src="js/shared/auth.js?v=33"></script>
    <script src="js/shared/version.js"></script>
    <script src="js/consegna.js?v=36"></script>
</body>
</html>
