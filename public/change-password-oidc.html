<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Imposta Password</title>
    <link rel="stylesheet" href="style.css?v=30">
</head>
<body class="login-page">
    <header class="stag">
        <svg class="stag-ill" aria-hidden="true"><use href="#ill-zucca"/></svg>
        <div class="stag-when">Gruppo di acquisto solidale</div>
        <h1>GASS Torpignattara</h1>
        <p id="season-produce" class="stag-prod"></p>
    </header>
    <div class="login-container">
        <div class="login-header">
            <p>Imposta la tua nuova password</p>
        </div>

        <div class="login-form">
            <div id="error-message" class="login-error-message"></div>

            <form id="change-password-form">
                <div class="form-group">
                    <label for="newPassword">Nuova password</label>
                    <input type="password" id="newPassword" name="newPassword" required autofocus minlength="8">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Conferma password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
                </div>

                <button type="submit" class="btn btn-go btn-block" id="submit-btn">Salva password</button>
            </form>
        </div>
    </div>

    <script src="js/shared/utils.js?v=30"></script>
    <script src="js/shared/season.js?v=30"></script>
    <script src="js/change-password-oidc.js?v=30"></script>
</body>
</html>
