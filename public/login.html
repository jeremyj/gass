<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASS Torpignattara - Login</title>
    <link rel="stylesheet" href="style.css?v=31">
</head>
<body class="login-page">
    <header class="stag">
        <div class="stag-art" aria-hidden="true"><svg class="stag-ill"><use href="#ill-zucca"/></svg></div>
        <div class="stag-when">Gruppo di acquisto solidale</div>
        <h1>GASS Torpignattara</h1>
        <p id="season-produce" class="stag-prod"></p>
    </header>
    <div class="login-container">

        <div class="login-form">
            <div id="error-message" class="login-error-message"></div>

            <!-- Authentik SSO button (shown only when OIDC is enabled) -->
            <div id="oidc-section" class="initially-hidden">
                <a href="/auth/oidc/login" class="btn btn-go btn-block" id="oidc-btn">
                    Accedi
                </a>
                <p class="login-alt"><a href="#" id="show-local-login">Accesso admin locale</a></p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-go btn-block" id="login-btn">Accedi</button>
            </form>
        </div>
    </div>

    <script src="js/shared/utils.js?v=30"></script>
    <script src="js/shared/season.js?v=30"></script>
    <script src="js/login.js?v=30"></script>
</body>
</html>
